{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md px-4">
  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 bg-brand-600 rounded-2xl shadow-lg mb-4">
      <span class="text-white font-bold text-2xl">S</span>
    </div>
    <h1 class="text-2xl font-bold text-white">Welcome back</h1>
    <p class="text-gray-400 mt-1">Sign in to your SlideAI account</p>
  </div>

  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
    {% if error %}
    <div class="mb-5 flex items-center gap-2 px-4 py-3 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-xl">
      <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">Email address</label>
        <input type="email" name="email" required autocomplete="email"
               class="input-field w-full" placeholder="you@example.com"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="input-field w-full" placeholder="••••••••"/>
      </div>
      <div class="flex items-center justify-between">
        <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
          <input type="checkbox" name="remember" class="w-4 h-4 rounded border-gray-600 bg-gray-800 text-brand-500 focus:ring-brand-500"/>
          Remember me
        </label>
      </div>
      <button type="submit" class="btn-primary w-full py-3 text-base font-semibold">
        Sign In
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-500">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="text-brand-400 hover:text-brand-300 font-medium">Create one free</a>
    </p>
  </div>
</div>
{% endblock %}
